---
name: PR

on:
  pull_request:
    branches:
      - main
  # The version job in release.yml opens its pull request with GITHUB_TOKEN,
  # and a pull request opened with that token does not fire `pull_request` —
  # GitHub declines to let a workflow start another workflow. Without this the
  # main ruleset's required Check would never report on it, and it could never
  # be merged.
  #
  # A ruleset matches a check by name whatever workflow posted it, and this is
  # the same job under the same name, so running it on the push satisfies the
  # same gate. Scoped to the branch prefix that job uses, so ordinary branches
  # still get one run rather than two.
  push:
    branches:
      - "release/**"

defaults:
  run:
    shell: bash

env:
  CI: true

# A new push to the PR makes the in-flight run irrelevant, so stop paying for it.
#
# The fallback is what keeps that true on the push trigger above, where there
# is no pull request number: without it every release/** push would share one
# group named "pr-" and cancel the run before it.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, test and build each take a couple of seconds, which is far less than the ~30s of
  # checkout, Node setup and install that a separate job would pay to run them. One job it is.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.1
          cache: true

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build:check

      - name: Test
        run: pnpm test:coverage
